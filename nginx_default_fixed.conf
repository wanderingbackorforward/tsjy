server {
    server_name smartinfracloud.top www.smartinfracloud.top _;
    charset utf-8;
    client_max_body_size 20m;

    location /api/gn/ {
        proxy_pass http://127.0.0.1:8001/api/gn/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
    location /api/area2/ {
        proxy_pass http://127.0.0.1:8002/api/area2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
    # TBM盾构诊断助手 (port 8000)
    location /tbm/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
    location /api/upload { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 120s; }
    location /api/detect { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 120s; }
    location /api/generate { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 120s; }
    location /api/feedback { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 120s; }
    location /api/regenerate { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 120s; }


    location /md/nycj/ {
        alias /opt/nycj/frontend-md/dist/nycj/;
        try_files $uri $uri/ /md/nycj/index.html;
        index index.html;
    }
    location = /md/nycj/index.html {
        alias /opt/nycj/frontend-md/dist/nycj/index.html;
    }

    location /md/ {
        alias /opt/nycj/frontend-md/dist/;
        try_files $uri $uri/ /md/index.html;
        index index.html;
    }
    location /md/assets/ {
        alias /opt/nycj/frontend-md/dist/assets/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /md/v2/ {
        alias /opt/nycj/frontend-md/dist/v2/;
        try_files $uri $uri/ /md/v2/index.html;
        index index.html;
    }
    location /md/v2/assets/ {
        alias /opt/nycj/frontend-md/dist/v2/assets/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /cockpit { return 301 /md/; }
    location /beijing/ {
        proxy_pass http://127.0.0.1:18081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ygzl/ {
        proxy_pass http://127.0.0.1:18080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /tsjy/api/ {
        proxy_pass http://127.0.0.1:8100/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location = /tsjy/ { return 302 /; }
    location = /tsjy { return 302 /; }
    location /tsjy/ {
        alias /opt/tsjy-frontend/dist/;
        try_files $uri $uri/ /tsjy/index.html;
        index index.html;
    }    location /cockpit/ { return 301 /md/; }

    location / {
        root /opt/tsjy-frontend/dist/;
        try_files $uri /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/smartinfracloud.top/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/smartinfracloud.top/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.smartinfracloud.top) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = smartinfracloud.top) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name smartinfracloud.top www.smartinfracloud.top _;
    return 404; # managed by Certbot




}